spring.application.name=portfolio

# Email Configuration (Reads Render Environment Variables)
spring.mail.host=${spring.mail.host:smtp.gmail.com}
spring.mail.port=${spring.mail.port:465}
spring.mail.username=${spring.mail.username:vickyarsvicky@gmail.com}
spring.mail.password=${spring.mail.password}

# Required SSL Settings for Port 465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
